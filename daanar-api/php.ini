; Railway/FrankenPHP PHP configuration
; Force-load extensions that nixpacks declares but FrankenPHP doesn't auto-load

; Image processing (required by Filament ImageColumn and FileUpload ->image())
extension=gd

; Internationalisation (required by Laravel's number formatting, Filament)
extension=intl

; Arbitrary precision math (used by Laravel internally)
extension=bcmath

; ZIP support (used by composer and some Laravel features)
extension=zip

; File info / MIME detection (already loaded but listed for completeness)
; extension=fileinfo

; Memory / upload limits for large AR model uploads
memory_limit = 1024M
upload_max_filesize = 350M
post_max_size = 350M
max_execution_time = 600
