<VirtualHost *:${PORT}>
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Landmark media is public storage, including uploads from the CMS.
    <Directory /app/storage/app/public>
        AllowOverride None
        php_admin_flag engine off
    </Directory>
    <LocationMatch "^/storage/.*\.(?i:php[0-9]*|phtml|phar)([./]|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
